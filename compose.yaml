services:
  introspector:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9100:9100"
    volumes:
      - data:/data
      - ${WIRETAP_SOCK_DIR:-/tmp}:/run/wiretap
    command:
      - --ingest=/run/wiretap/wiretap.sock
      - --listen=0.0.0.0:9100
      - --data-dir=/data
      - --static-dir=/srv/dashboard
      - --genesis-unix=1606824023
      - --retention-days=30
    restart: unless-stopped

volumes:
  data:
