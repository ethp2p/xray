services:
  xray:
    build: .
    user: "${XRAY_UID:-1000}:${XRAY_GID:-1000}"
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - ${XRAY_DATA_DIR:-~/.xray/data}:/data
      - ${XRAY_SOCK_DIR:-/tmp}:/run/xray
    command:
      - --ingest=/run/xray/xray.sock
      - --listen=0.0.0.0:9100
      - --data-dir=/data
      - --static-dir=/srv/dashboard
      - --genesis-unix=1606824023
      - --retention-days=30
    restart: unless-stopped
